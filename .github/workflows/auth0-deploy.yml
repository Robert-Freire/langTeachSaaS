name: Auth0 Config Deploy

on:
  push:
    branches: [main]
    paths: ['auth0/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth0-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Auth0 tenant config
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Install Auth0 Deploy CLI
        run: npm install -g auth0-deploy-cli@7.20.0

      - name: Deploy tenant config
        env:
          AUTH0_DOMAIN:        ${{ secrets.AUTH0_PROD_DOMAIN }}
          AUTH0_CLIENT_ID:     ${{ secrets.AUTH0_DEPLOY_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_DEPLOY_CLIENT_SECRET }}
        run: |
          a0deploy import \
            --config_file auth0/config.json \
            --input_file  auth0/tenant \
            --env AUTH0_DOMAIN="$AUTH0_DOMAIN" \
                  AUTH0_CLIENT_ID="$AUTH0_CLIENT_ID" \
                  AUTH0_CLIENT_SECRET="$AUTH0_CLIENT_SECRET" \
                  ENV=prod
